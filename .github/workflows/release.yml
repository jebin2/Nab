name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Fetch pinned Bun (for CLI export)
        run: node scripts/fetch-bun.mjs

      - name: Build (electron-vite)
        run: npm run build

      - name: Package (AppImage)
        run: npx electron-builder --linux --config electron-builder.config.ts --publish never

      - name: Upload to release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    runs-on: macos-14          # Apple Silicon (arm64)
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Fetch pinned Bun (for CLI export)
        run: node scripts/fetch-bun.mjs

      - name: Build (electron-vite)
        run: npm run build

      - name: Package (dmg)
        run: npx electron-builder --mac --config electron-builder.config.ts --publish never
        env:
          # Skip code-signing in CI — add CSC_LINK / CSC_KEY_PASSWORD secrets to enable it
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload to release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Fetch pinned Bun (for CLI export)
        run: node scripts/fetch-bun.mjs

      - name: Build (electron-vite)
        run: npm run build

      - name: Package (portable exe)
        run: npx electron-builder --win --config electron-builder.config.ts --publish never

      - name: Upload to release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
